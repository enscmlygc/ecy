<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bekleme Listesi · BIMHub</title>
  <meta name="description" data-i18n="wl.lead" content="Bekleme listesindesiniz. Sıra size geldiğinde davet alacaksınız.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FAFAF7">
</head>
<body data-page="waitlist">
  <div id="site-statusbar"></div>
  <div id="site-header"></div>

  <main>
    <section class="waitlist-wrap">
      <div class="wrap">
        <div class="waitlist-card reveal">
          <div class="waitlist-card__check" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-11"/></svg>
          </div>
          <span class="eyebrow eyebrow--ochre" style="justify-content: center;">EARLY ACCESS · v0.4</span>
          <h2 style="margin: 14px 0;" data-i18n="wl.title">Hoş geldiniz.</h2>
          <p class="lead" data-i18n="wl.lead">…</p>
          <p class="mono" id="wl-email" style="color: var(--violet); margin-bottom: 16px; font-size: 13px;"></p>

          <div class="waitlist-card__queue">
            <div class="waitlist-card__queue__item">
              <b id="wl-pos">#1,247</b>
              <span data-i18n="wl.queue">Sıradaki</span>
            </div>
            <div class="waitlist-card__queue__item">
              <b id="wl-week">+412</b>
              <span data-i18n="wl.position">Bu hafta</span>
            </div>
            <div class="waitlist-card__queue__item">
              <b style="color: var(--ochre);">−50%</b>
              <span data-i18n="wl.discount">Pro indirim</span>
            </div>
          </div>

          <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <a href="index.html" class="btn btn--ghost" data-i18n="wl.back">Anasayfaya Dön</a>
            <button type="button" class="btn btn--violet" id="share-btn"><span data-i18n="wl.share">Bir arkadaşınızı davet edin</span> <span class="arrow">→</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-drawer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/tools.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      var url = new URL(location.href);
      var email = url.searchParams.get("email");
      if (email) document.getElementById("wl-email").textContent = email;

      // Stable queue position based on email hash (or random fallback)
      function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = ((h<<5)-h) + s.charCodeAt(i) | 0; return Math.abs(h); }
      var pos = email ? 1200 + (hash(email) % 800) : 1247;
      document.getElementById("wl-pos").textContent = "#" + pos.toLocaleString("tr-TR");
      document.getElementById("wl-week").textContent = "+" + (380 + (hash(email||"x") % 80));

      document.getElementById("share-btn").addEventListener("click", async function () {
        var data = { title: "BIMHub", text: "BIM araçları tek merkezde — erken erişim.", url: location.origin };
        try {
          if (navigator.share) await navigator.share(data);
          else { await navigator.clipboard.writeText(data.url); window.BIMHUB_TOAST && window.BIMHUB_TOAST("✓ " + (window.BIMHUB_CTX?.T?.("wl.copied") || "Link kopyalandı")); }
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
