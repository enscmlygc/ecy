<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yol Haritası · BIMHub</title>
  <meta name="description" data-i18n="rmpage.lead" content="Şeffaf üretim. Hangi araçların ne zaman geleceğini herkes görür.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FAFAF7">
</head>
<body data-page="roadmap">
  <div id="site-statusbar"></div>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="page-hero__bg" aria-hidden="true"></div>
      <div class="wrap reveal">
        <span class="eyebrow" data-i18n="rmpage.eyebrow">Yol Haritası</span>
        <h1 data-i18n="rmpage.title">Şeffaf üretim</h1>
        <p class="lead" data-i18n="rmpage.lead">…</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="roadmap reveal">
          <div class="rm-q" style="min-height: 280px;">
            <div class="rm-q__head">
              <span class="rm-q__q" data-i18n="rm.q1.t">Q2 2026</span>
              <span class="rm-q__chip rm-q__chip--now" data-i18n="rm.now">Şimdi</span>
            </div>
            <ul class="rm-q__list">
              <li data-i18n="rm.q1.l1">DWG ↔ PDF (Beta)</li>
              <li data-i18n="rm.q1.l2">AI Çakışma Kontrolü (Beta)</li>
              <li data-i18n="rm.q1.l3">PDF Metraj</li>
              <li data-i18n="rm.q1.l4">Eskiz → Render</li>
            </ul>
          </div>
          <div class="rm-q" style="min-height: 280px;">
            <div class="rm-q__head">
              <span class="rm-q__q" data-i18n="rm.q2.t">Q3 2026</span>
              <span class="rm-q__chip rm-q__chip--next" data-i18n="rm.next">Sıradaki</span>
            </div>
            <ul class="rm-q__list">
              <li data-i18n="rm.q2.l1">…</li>
              <li data-i18n="rm.q2.l2">…</li>
              <li data-i18n="rm.q2.l3">…</li>
              <li data-i18n="rm.q2.l4">…</li>
            </ul>
          </div>
          <div class="rm-q" style="min-height: 280px;">
            <div class="rm-q__head">
              <span class="rm-q__q" data-i18n="rm.q3.t">Q4 2026</span>
              <span class="rm-q__chip rm-q__chip--soon" data-i18n="rm.soon">Daha sonra</span>
            </div>
            <ul class="rm-q__list">
              <li data-i18n="rm.q3.l1">…</li>
              <li data-i18n="rm.q3.l2">…</li>
              <li data-i18n="rm.q3.l3">…</li>
              <li data-i18n="rm.q3.l4">…</li>
            </ul>
          </div>
          <div class="rm-q" style="min-height: 280px;">
            <div class="rm-q__head">
              <span class="rm-q__q" data-i18n="rm.q4.t">2027</span>
              <span class="rm-q__chip rm-q__chip--soon" data-i18n="rm.soon">Daha sonra</span>
            </div>
            <ul class="rm-q__list">
              <li data-i18n="rm.q4.l1">…</li>
              <li data-i18n="rm.q4.l2">…</li>
              <li data-i18n="rm.q4.l3">…</li>
              <li data-i18n="rm.q4.l4">…</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <section class="cta-strip" id="waitlist">
      <div class="cta-strip__bg" aria-hidden="true"></div>
      <div class="cta-strip__grid" aria-hidden="true"></div>
      <div class="wrap">
        <span class="eyebrow eyebrow--ochre">EARLY ACCESS</span>
        <h2 style="margin-top: 18px;"><span data-i18n="cta.title.a">İlk arayı</span> <em data-i18n="cta.title.b">siz açın.</em></h2>
        <p class="lead" data-i18n="cta.lead">…</p>
        <form class="signup" data-waitlist data-redirect="true" autocomplete="off">
          <input type="email" required data-i18n-attr="placeholder" data-i18n="cta.email" placeholder="ornek@studyo.com">
          <button type="submit" class="btn btn--ochre btn--shimmer"><span data-i18n="cta.button">Bekleme Listesine Katıl</span> <span class="arrow">→</span></button>
        </form>
        <p class="signup__msg"></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-drawer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/tools.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
