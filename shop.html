<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksiyon · Esse</title>
  <meta name="description" content="Esse Spring / Summer '26 koleksiyonu — elbise, triko, üst giyim ve dış giyim. Zamansız, zarif parçalar.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- PWA / iOS uygulama deneyimi -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2E2820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Esse">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="pagehead">
      <div class="wrap">
        <div class="breadcrumb"><a href="index.html">Anasayfa</a> · <span id="crumb">Koleksiyon</span></div>
        <h1 id="pageTitle">Koleksiyon</h1>
        <p id="pageSub">Spring / Summer '26 · zamansız ve zarif parçalar</p>
      </div>
    </section>

    <section class="section wrap">
      <div class="toolbar">
        <div class="filters" id="filters"></div>
        <div class="sort">
          <select id="sort" aria-label="Sırala">
            <option value="featured">Öne Çıkanlar</option>
            <option value="price-asc">Fiyat: Artan</option>
            <option value="price-desc">Fiyat: Azalan</option>
            <option value="name">İsme Göre (A–Z)</option>
          </select>
        </div>
      </div>
      <div class="products" id="grid"></div>
      <p class="center muted" id="empty" style="display:none;padding:60px 0">Bu kategoride henüz ürün bulunmuyor.</p>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-drawer"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    window.ESSE_PAGE = function (ctx) {
      var cats = [
        { key: "all", t: "Tümü" },
        { key: "elbise", t: "Elbise" },
        { key: "triko", t: "Triko" },
        { key: "ust-giyim", t: "Üst Giyim" },
        { key: "dis-giyim", t: "Dış Giyim" },
        { key: "takim", t: "Takım" },
        { key: "sale", t: "İndirim" }
      ];
      var titles = {
        all: ["Koleksiyon", "Spring / Summer '26 · zamansız ve zarif parçalar"],
        elbise: ["Elbise", "Gündüzden geceye, akışkan ve zarif siluetler"],
        triko: ["Triko", "Yumuşak dokular, sarıp sarmalayan rahatlık"],
        "ust-giyim": ["Üst Giyim", "Gömlek, bluz, etek ve pantolon seçkisi"],
        "dis-giyim": ["Dış Giyim", "Kaban, ceket ve trençkot — imza parçalar"],
        takim: ["Takım", "Koordineli ikililerle kusursuz bütünlük"],
        sale: ["İndirim", "Sevilen parçalar, özel fiyatlarla"]
      };
      var active = ctx.getParam("cat") || "all";
      if (!titles[active]) active = "all";

      // Filtre butonları
      document.getElementById("filters").innerHTML = cats.map(function (c) {
        return '<button data-cat="' + c.key + '" class="' + (c.key === active ? "active" : "") + '">' + c.t + '</button>';
      }).join("");

      function setHead(key) {
        document.getElementById("pageTitle").textContent = titles[key][0];
        document.getElementById("pageSub").textContent = titles[key][1];
        document.getElementById("crumb").textContent = titles[key][0];
        document.title = titles[key][0] + " · Esse";
      }

      function list(key) {
        if (key === "all") return ctx.P.slice();
        if (key === "sale") return ctx.P.filter(function (p) { return p.sale; });
        return ctx.P.filter(function (p) { return p.catKey === key; });
      }

      function sortList(arr, mode) {
        var a = arr.slice();
        if (mode === "price-asc") a.sort(function (x, y) { return x.price - y.price; });
        else if (mode === "price-desc") a.sort(function (x, y) { return y.price - x.price; });
        else if (mode === "name") a.sort(function (x, y) { return x.name.localeCompare(y.name, "tr"); });
        return a;
      }

      function render() {
        var arr = sortList(list(active), document.getElementById("sort").value);
        ctx.renderGrid("#grid", arr);
        document.getElementById("empty").style.display = arr.length ? "none" : "block";
        // reveal observer'ı yeniden tetikle
        document.querySelectorAll(".reveal").forEach(function (e) { e.classList.add("in"); });
      }

      setHead(active); render();

      document.getElementById("filters").addEventListener("click", function (e) {
        var b = e.target.closest("[data-cat]"); if (!b) return;
        active = b.dataset.cat;
        document.querySelectorAll("#filters button").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        setHead(active); render();
        history.replaceState(null, "", active === "all" ? "shop.html" : "shop.html?cat=" + active);
      });
      document.getElementById("sort").addEventListener("change", render);
    };
  </script>
</body>
</html>
