<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün · Esse</title>
  <meta name="description" content="Esse koleksiyonundan zarif bir parça.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- PWA / iOS uygulama deneyimi -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2E2820">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Esse">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <section class="section wrap" style="padding-top:clamp(34px,5vw,56px)">
      <div class="breadcrumb" style="margin-bottom:30px"><a href="index.html">Anasayfa</a> · <a href="shop.html">Koleksiyon</a> · <span id="crumb"></span></div>
      <div class="pdp" id="pdp"></div>
    </section>

    <section class="section wrap" style="padding-top:0">
      <div class="s-head"><span class="eyebrow">Tamamlayın</span><h2>Bunları da Beğenebilirsiniz</h2></div>
      <div class="products" id="related"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="site-drawer"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    window.ESSE_PAGE = function (ctx) {
      var id = ctx.getParam("id");
      var p = ctx.byId(id) || ctx.P[0];
      document.getElementById("crumb").textContent = p.name;
      document.title = p.name + " · Esse";

      var price = p.oldPrice
        ? '<span class="old">' + ctx.TL(p.oldPrice) + '</span><span class="new">' + ctx.TL(p.price) + '</span>'
        : ctx.TL(p.price);
      var colors = p.colors.map(function (c, i) {
        return '<button class="color-btn ' + (i === 0 ? "active" : "") + '" data-color style="background:' + c + '" aria-label="Renk"></button>';
      }).join("");
      var sizes = p.sizes.map(function (s, i) {
        return '<button class="size-btn ' + (i === 0 ? "active" : "") + '" data-size>' + s + '</button>';
      }).join("");

      document.getElementById("pdp").innerHTML =
        '<div class="pdp__gallery"><div class="pdp__main">' + ctx.mediaHtml(p) + '</div></div>' +
        '<div class="pdp__info">' +
          '<div class="card__cat">' + p.cat + (p.tag ? ' · ' + p.tag : '') + '</div>' +
          '<h1>' + p.name + '</h1>' +
          '<div class="pdp__price">' + price + '</div>' +
          '<p class="pdp__desc">' + p.desc + '</p>' +
          '<div class="opt"><div class="opt__label">Renk</div><div class="opt__row">' + colors + '</div></div>' +
          '<div class="opt"><div class="opt__label">Beden</div><div class="opt__row" id="sizeRow">' + sizes + '</div></div>' +
          '<div class="pdp__actions">' +
            '<button class="btn btn--block" id="pdpAdd">Sepete Ekle</button>' +
            '<button class="btn btn--ghost" id="pdpFav" aria-label="Favori" style="padding:16px">♡</button>' +
          '</div>' +
          '<div class="acc">' +
            accItem("Ürün Detayı", p.fabric) +
            accItem("Teslimat & İade", "Siparişleriniz 1–3 iş günü içinde kargoya verilir. 1500 ₺ üzeri alışverişlerde kargo ücretsizdir. 14 gün içinde koşulsuz iade hakkınız vardır.") +
            accItem("Bakım", "Hassas yıkama önerilir. Ütüleme düşük ısıda, ters yüzden yapılmalıdır. Kuru temizleme uygundur.") +
          '</div>' +
        '</div>';

      function accItem(q, a) {
        return '<div class="acc__item"><button class="acc__q">' + q + '<span>+</span></button><div class="acc__a"><p>' + a + '</p></div></div>';
      }

      var selectedSize = p.sizes[0];
      document.getElementById("sizeRow").addEventListener("click", function (e) {
        var b = e.target.closest("[data-size]"); if (!b) return;
        this.querySelectorAll(".size-btn").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active"); selectedSize = b.textContent;
      });
      document.querySelector(".opt__row").addEventListener("click", function (e) {
        var b = e.target.closest("[data-color]"); if (!b) return;
        this.querySelectorAll(".color-btn").forEach(function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
      document.getElementById("pdpAdd").addEventListener("click", function () { ctx.addToCart(p.id, { size: selectedSize }); });
      document.getElementById("pdpFav").addEventListener("click", function () {
        this.classList.toggle("on"); this.textContent = this.classList.contains("on") ? "♥" : "♡";
        this.style.color = this.classList.contains("on") ? "#B8945F" : "";
      });
      document.querySelector(".acc").addEventListener("click", function (e) {
        var q = e.target.closest(".acc__q"); if (!q) return;
        q.parentElement.classList.toggle("open");
      });

      // İlgili ürünler
      var related = ctx.P.filter(function (x) { return x.catKey === p.catKey && x.id !== p.id; });
      if (related.length < 4) related = related.concat(ctx.P.filter(function (x) { return x.id !== p.id && related.indexOf(x) < 0; }));
      ctx.renderGrid("#related", related.slice(0, 4));
    };
  </script>
</body>
</html>
