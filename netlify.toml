# Esse İstanbul — Netlify yapılandırması
# Statik site: build adımı yok, kök dizin doğrudan yayınlanır.

[build]
  publish = "."
  command = ""

# Statik varlıkları uzun süre önbelleğe al (görsel, css, js)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Temel güvenlik başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
